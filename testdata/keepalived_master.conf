===== keepalived.conf @ .6 =====
! Configuration File for keepalived
global_defs {
   router_id lvs01          #router_id 机器标识，通常为hostname，但不一定非得是hostname。故障发生时，邮件通知会用到。
}
vrrp_instance VI_1 {            #vrrp实例定义部分
    state MASTER               #设置lvs的状态，MASTER和BACKUP两种，必须大写
    interface ens33               #设置对外服务的接口
    virtual_router_id 100        #设置虚拟路由标示，这个标示是一个数字，同一个vrrp实例使用唯一标示
    priority 100               #定义优先级，数字越大优先级越高，在一个vrrp——instance下，master的优先级必须大于backup
    advert_int 1              #设定master与backup负载均衡器之间同步检查的时间间隔，单位是秒
    authentication {           #设置验证类型和密码
        auth_type PASS         #主要有PASS和AH两种
        auth_pass 1111         #验证密码，同一个vrrp_instance下MASTER和BACKUP密码必须相同
    }
    virtual_ipaddress {         #设置虚拟ip地址，可以设置多个，每行一个
        192.168.5.5
    }
}

# 监听 HTTP (80)
virtual_server 192.168.5.5 80 {
    delay_loop 5
    lb_algo wrr
    lb_kind DR
    protocol TCP
    persistence_timeout 60
	real_server 192.168.5.8 80 {
        weight 1
        TCP_CHECK {
            connect_timeout 3
            retry 2
            delay_before_retry 2
            connect_port 80
        }
    }
    real_server 192.168.5.9 80 {
        weight 1
        TCP_CHECK {
            connect_timeout 3
            retry 2
            delay_before_retry 2
            connect_port 80
        }
    }
}

# 监听 HTTPS (443)
virtual_server 192.168.5.5 443 {
    delay_loop 5
    lb_algo wrr
    lb_kind DR
    protocol TCP
    persistence_timeout 60
	real_server 192.168.5.8 443 {
        weight 1
        TCP_CHECK {
            connect_timeout 3
            retry 2
            delay_before_retry 2
            connect_port 443
        }
    }
    real_server 192.168.5.9 443 {
        weight 1
        TCP_CHECK {
            connect_timeout 3
            retry 2
            delay_before_retry 2
            connect_port 443
        }
    }
}
# 监听 HTTPS/3 (UDP 443 - QUIC)
virtual_server 192.168.5.5 443 {
    delay_loop 5
    lb_algo wrr
    lb_kind DR
    protocol UDP        
    persistence_timeout 60
    real_server 192.168.5.8 443 {
        weight 1
        UDP_CHECK {
            connect_timeout 3
        }
    }
    real_server 192.168.5.9 443 {
        weight 1
        UDP_CHECK {
            connect_timeout 3
        }
    }
}
