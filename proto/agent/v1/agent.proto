syntax = "proto3";

// Package agent.v1 是控制面 ↔ Agent 的通信契约（唯一事实来源）。
// 任何一端改 proto 都需重新生成代码（make proto）并同步对端。
package agent.v1;

option go_package = "github.com/th/ngxcp/gen/agent/v1;agentv1";

// AgentService 控制面暴露给 Agent 的 gRPC 服务。
service AgentService {
  // Register：用一次性 enroll token 换取 mTLS 客户端证书。
  // 此时 Agent 尚无客户端证书，故该 RPC 通过 TLS + token 鉴权（拦截器跳过客户端证书校验）。
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Heartbeat：双向流。Agent 周期上报；控制面可随时下发指令（刷新能力 / 跑合规）。
  rpc Heartbeat(stream HeartbeatRequest) returns (stream HeartbeatResponse);

  // ReportCapability：Agent 主动上报完整能力基线（注册后首次 / 定时 / 配置变更）。
  rpc ReportCapability(CapabilityReport) returns (Ack);
}

message RegisterRequest {
  string enroll_token = 1; // 控制面下发的一次性令牌（仅原文返回一次，库内仅存 SHA256）
  string hostname = 2;
  bytes csr = 3;          // Agent 本地生成的私钥签名请求；私钥永不出节点
}

message RegisterResponse {
  int64 node_id = 1;      // 控制面节点 ID（也写入证书 Serial，用于反查身份）
  bytes client_cert = 2;  // CA 签发的客户端证书（PEM）
  bytes ca_cert = 3;      // 控制面 CA 证书（PEM）
  int64 cert_expires_at = 4; // 证书过期时间，unix 秒
  ServerConfig config = 5;   // 心跳间隔、采集配置等
}

message ServerConfig {
  int64 heartbeat_interval_sec = 1; // 默认 10
  int64 heartbeat_timeout_sec = 2;  // 默认 30（超过未心跳 → 标记 offline）
  int64 clock_skew_warn_sec = 3;    // 默认 1（时钟偏差超过告警）
}

message HeartbeatRequest {
  enum Type {
    PING = 0;
    CAPABILITY = 1;
    COMPLIANCE = 2;
    METRICS = 3;
    FS_PROBE = 4;                 // T018：日志/FS 健康探测上报
    CONFIG_TREE = 5;              // T018：nginx -T 配置树上报
    LOG_TARGETS = 6;              // T018：日志采集目标上报
    CONFIG_VALIDATE = 7;          // T024：nginx -t 校验结果上报
  }
  Type type = 1;
  int64 timestamp = 2;            // 节点本地时间（unix 秒），控制面据此算时钟偏差
  Capability capability = 3;
  ComplianceReport compliance = 4;
  bytes metrics_payload = 5;      // Prometheus 文本格式
  FsProbeReport fs_probe = 6;     // T018：日志/FS 健康探测结果
  ConfigTreeReport config_tree = 7;   // T018：nginx -T 配置树
  LogTargetsReport log_targets = 8;   // T018：日志采集目标清单
  ValidateResult validate_result = 9; // T024：nginx -t 校验结果
}

message HeartbeatResponse {
  enum Command {
    NONE = 0;
    REFRESH_CAPABILITY = 1; // 让 Agent 重新跑 nginx -V / -T 并上报
    RUN_COMPLIANCE = 2;     // 让 Agent 重新跑 DR 合规自检
    VALIDATE_CONFIG = 3;    // T024：让 Agent 在本地跑 nginx -t 校验（带待校验文件）
  }
  Command command = 1;
  string task_id = 2;       // 幂等键，防止重放
  // T024：VALIDATE_CONFIG 命令携带的校验任务（待校验文件 + 运行参数）。
  ValidateTask validate_task = 3;
}

message CapabilityReport {
  int64 node_id = 1;
  Capability capability = 2;
}

message Ack {
  bool ok = 1;
  string message = 2;
}

message Capability {
  string hostname = 1;
  string os = 2;
  string kernel = 3;
  NginxInfo nginx = 4;            // null 表示非 nginx 节点（如纯 Director）
  bool has_keepalived = 5;
  bool has_ipvsadm = 6;
  ComplianceReport compliance = 7;
  double clock_skew_seconds = 8;  // 与控制面的时间偏差（由控制面计算填入）
  SystemInfo system = 9;          // T018：主机运行底座画像（OS 细节/SELinux/ulimit/磁盘等）
}

message NginxInfo {
  string version = 1;
  string binary_path = 2;
  string configure_args = 3;
  string prefix = 4;
  string conf_path = 5;
  string sbin_path = 6;
  string pid_path = 7;
  string lock_path = 8;
  string error_log_path = 9;
  string http_log_path = 10;
  string run_user = 11;
  string run_group = 12;
  string compiler = 13;
  string openssl_version = 14;
  bool tls_sni = 15;
  repeated string static_modules = 16;
  repeated string dynamic_modules = 17;
  repeated ConfigFile config_files = 18; // 来自 nginx -T
  repeated string log_files = 19;        // 从配置提取
  string config_hash = 20;
}

message ConfigFile {
  string path = 1;
  string content = 2;
  string sha256 = 3;
  int64 size = 4;
}

message ComplianceReport {
  int64 checked_at = 1;                 // unix 秒
  string role = 2;                     // real_server | director | director_and_rs | unknown
  repeated ComplianceItem items = 3;
  bool passed = 4;
}

message ComplianceItem {
  string name = 1;        // vip_on_lo
  string title = 2;       // VIP 绑定在 lo 且掩码 /32
  bool passed = 3;
  string expected = 4;
  string actual = 5;
  string severity = 6;    // critical | warning
  string fix_cmd = 7;     // 修复命令建议
}

// FsProbeReport 是 Agent 在主机上探测日志/文件系统健康的结果（T018）。
// 复用 ComplianceItem 结构表达各项检查通过与否；控制面据此判定节点是否 degraded。
// 典型检查项：nginx 路径磁盘使用率、证书剩余有效期、配置/证书文件权限、日志目录可写、
// error.log 错误速率、pid 文件存在性等（见 internal/domain/probe 规则目录）。
message FsProbeReport {
  int64 checked_at = 1;                 // unix 秒
  repeated ComplianceItem items = 2;    // 各项检查结果（severity=critical 不通过 → 节点 degraded）
}

// SystemInfo 是主机的运行底座画像（T018）。
// 采集为尽力而为：单项取不到时留零值，不阻断整体能力上报。
message SystemInfo {
  string os = 1;                  // "rocky 9.4"
  string kernel = 2;
  string nginx_managed_by = 3;    // systemd | manual
  string selinux_status = 4;      // enforcing | permissive | disabled | unknown
  int64 ulimit_nofile = 5;
  string timezone = 6;            // Asia/Shanghai
  bool ntp_synced = 7;
  string logrotate_conf = 8;      // /etc/logrotate.d/nginx，空表示不存在
  map<string, int64> disk_free = 9; // 挂载点 -> 可用字节
  repeated string warnings = 10;  // 采集失败的项（selinux / ntp / disk ...）
}

// ConfigTreeReport 是 `nginx -T` 解析出的配置树（T018）。
// 控制面只持久化元数据（路径/大小/哈希），内容按需由 Agent 重新采集——
// 完整配置可能数 MB，常驻落库既浪费也会把私钥路径等敏感信息扩散到数据库。
message ConfigTreeReport {
  int64 captured_at = 1;          // unix 秒
  repeated ConfigFile files = 2;
}

// LogTargetsReport 是从配置里提取的日志采集目标清单（T018）。
// 决定「Agent 该 tail 哪些文件」：off / syslog 目标跳过，变量路径只标记不展开。
message LogTargetsReport {
  int64 captured_at = 1;          // unix 秒
  repeated LogTarget items = 2;
}

message LogTarget {
  string path = 1;                // /var/log/nginx/access.log
  string type = 2;                // access | error
  string format = 3;              // main | json（未指定为空，即 nginx 默认 combined）
  string level = 4;               // warn | error（仅 error_log）
  bool is_syslog = 5;             // syslog:server=... → 跳过采集
  bool is_off = 6;                // off / stderr / memory → 跳过采集
  bool has_variable = 7;          // 路径含 $host 等变量 → 不展开，告警
  string skip_reason = 8;         // off | syslog | stderr | memory
  int64 size = 9;                 // 字节；stat 失败为 -1
  uint64 inode = 10;              // logrotate 轮转检测
  string stat_err = 11;           // stat 失败原因
}

// ===== T024：nginx -t 校验（Agent 侧） =====
// 校验必须带完整上下文（主配置 + 所有 include 文件），故以「文件集合」描述待校验配置，
// Agent 写到 staging 目录后执行 `nginx -t -p <prefix> -c <conf>`，不能单独校验单文件。

// NginxError 是 nginx -t 输出的单条结构化错误。
message NginxError {
  string level = 1;   // emerg | alert | crit | error | warn
  string message = 2; // 不含文件路径/行号前缀的纯消息
  string file = 3;    // 出错文件绝对路径（来自 nginx 输出）
  int64 line = 4;     // 出错行号，无则为 0
}

// ValidateFile 是待校验的单个配置文件（path 相对 staging 根，content 为文件原文）。
message ValidateFile {
  string path = 1;    // 如 "nginx.conf" 或 "conf.d/api.conf"
  string content = 2; // 文件原文
}

// ValidateTask 是控制面下发给 Agent 的校验任务。
message ValidateTask {
  string task_id = 1;     // 幂等键，结果回传时原样带回
  string nginx_path = 2;  // nginx 二进制路径，空则默认 /usr/sbin/nginx
  string prefix = 3;      // -p 参数（nginx 前缀，保证 include 相对路径一致）
  string conf_path = 4;   // staging 内的主配置路径（相对），如 "nginx.conf"
  repeated ValidateFile files = 5; // 待写入 staging 的文件集合
}

// ValidateResult 是 Agent 回传的校验结果。
message ValidateResult {
  string task_id = 1;
  bool ok = 2;                  // 语法是否通过
  repeated NginxError errors = 3; // 结构化错误（ok=false 时有内容）
  string raw = 4;              // nginx -t 原始输出
}
