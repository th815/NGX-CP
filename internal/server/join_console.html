<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NGX-CP · 节点接入</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
        background:#0f1115; color:#e6e9ef; display:flex; justify-content:center; padding:40px 16px; }
  .card { width:100%; max-width:760px; background:#171a21; border:1px solid #262b36; border-radius:14px; padding:28px 30px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#9aa4b2; margin:0 0 22px; }
  label { display:block; font-weight:600; margin:16px 0 6px; color:#c7cedb; }
  input,select { width:100%; padding:9px 11px; background:#0f1115; border:1px solid #2c3340; color:#e6e9ef; border-radius:8px; font-size:14px; }
  input:focus,select:focus { outline:none; border-color:#4f8cff; }
  .row { display:flex; gap:12px; }
  .row > div { flex:1; }
  button { margin-top:20px; width:100%; padding:11px; background:#4f8cff; color:#fff; border:0; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; }
  button:hover { background:#3f7af0; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .out { margin-top:22px; background:#0f1115; border:1px solid #262b36; border-radius:10px; padding:16px; display:none; }
  .out.show { display:block; }
  code.block { display:block; white-space:pre-wrap; word-break:break-all; background:#0b0d11; border:1px solid #20242e;
               padding:12px; border-radius:8px; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; color:#9ee6b4; }
  .copy { float:right; font-size:12px; padding:3px 10px; background:#222834; color:#c7cedb; border:1px solid #333b49; border-radius:6px; cursor:pointer; }
  .copy:hover { background:#2c3340; }
  .note { color:#9aa4b2; font-size:12.5px; margin-top:8px; }
  .err { color:#ff8a8a; margin-top:12px; min-height:18px; }
  details { margin-top:18px; }
  summary { cursor:pointer; color:#9aa4b2; }
  pre.script { max-height:320px; overflow:auto; background:#0b0d11; border:1px solid #20242e; padding:12px; border-radius:8px;
               font:12px/1.5 ui-monospace,monospace; color:#c7cedb; }
</style>
</head>
<body>
  <div class="card">
    <h1>NGX-CP · 节点接入</h1>
    <p class="sub">生成一次性 Join Token，复制下方一行命令到新节点执行即可自注册上线。</p>

    <label>管理员令牌（Bearer，仅存于本浏览器 sessionStorage）</label>
    <input id="token" type="password" placeholder="NGXCP_AUTH_ADMIN_TOKEN" autocomplete="off" />

    <div class="row">
      <div>
        <label>节点角色</label>
        <select id="role">
          <option value="real_server">real_server（Nginx RS）</option>
          <option value="director">director（LVS Director）</option>
          <option value="director_and_rs">director_and_rs</option>
          <option value="unknown">unknown</option>
        </select>
      </div>
      <div>
        <label>Token 有效期</label>
        <input id="ttl" value="1h" placeholder="1h / 30m / 24h" />
      </div>
    </div>

    <button id="gen">生成接入令牌</button>
    <div class="err" id="err"></div>

    <div class="out" id="out">
      <span class="copy" id="copyCmd">复制</span>
      <strong>在目标节点以 root 执行：</strong>
      <code class="block" id="cmd"></code>
      <div class="note" id="exp"></div>
      <details>
        <summary>查看安装脚本（也可手动保存后再跑）</summary>
        <pre class="script" id="script"></pre>
      </details>
    </div>
  </div>

<script>
const ORIGIN = "__ORIGIN__";
const GRPC = "__GRPC__";
const $ = id => document.getElementById(id);

$("gen").onclick = async () => {
  const auth = $("token").value.trim();
  if (!auth) { $("err").textContent = "请先填管理员令牌"; return; }
  const role = $("role").value;
  const ttl = encodeURIComponent($("ttl").value.trim() || "1h");
  $("err").textContent = ""; $("gen").disabled = true;
  try {
    const r = await fetch(`${ORIGIN}/api/v1/join-tokens?role=${role}&ttl=${ttl}`, {
      method: "POST", headers: { Authorization: "Bearer " + auth }
    });
    const j = await r.json();
    if (!r.ok) throw new Error((j.error && j.error.message) || ("HTTP " + r.status));
    const cmd = `curl -fsSL ${ORIGIN}/agent/install.sh | sudo bash -s -- --cp ${ORIGIN} --grpc ${GRPC} --token ${j.data.token}`;
    $("cmd").textContent = cmd;
    $("exp").textContent = `Token 过期时间：${new Date(j.data.expires_at).toLocaleString()}（过期前未使用即失效）`;
    $("out").classList.add("show");
    const sc = await fetch(`${ORIGIN}/agent/install.sh`);
    $("script").textContent = await sc.text();
    sessionStorage.setItem("ngxcp_admin_token", auth);
  } catch (e) {
    $("err").textContent = "生成失败：" + e.message;
  } finally {
    $("gen").disabled = false;
  }
};

$("copyCmd").onclick = () => {
  navigator.clipboard.writeText($("cmd").textContent).then(() => {
    $("copyCmd").textContent = "已复制"; setTimeout(() => $("copyCmd").textContent = "复制", 1500);
  });
};

// 恢复上次填入的管理员令牌
const saved = sessionStorage.getItem("ngxcp_admin_token");
if (saved) $("token").value = saved;
</script>
</body>
</html>
